<!doctype html>
<!-- KAPAK ŞABLONU — 1600x900 render edin.
     İçerik ortadaki 1200px'te kalmalı (.safe): listelerde 4:3 kırpılıyor.
     Değiştirilecekler: pill metni, rozet, başlık (en fazla 2 satır), alt başlık, chip'ler, kaynak. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body {
    width: 1600px; height: 900px; position: relative;
    background:
      radial-gradient(900px 620px at 15% 12%, rgba(59, 91, 219, 0.30), transparent 70%),
      radial-gradient(760px 520px at 90% 92%, rgba(95, 208, 243, 0.14), transparent 70%),
      var(--bg);
  }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(ellipse at center, #000 35%, transparent 80%); }
  .safe { position: absolute; left: 200px; right: 200px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { display: flex; align-items: center; gap: 14px; }
  .pill { font-size: 21px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-ink); border: 1.5px solid rgba(147,168,251,0.35); border-radius: 999px; padding: 9px 20px; }
  .badge { font-family: var(--mono); font-size: 21px; color: #0a0d14; background: var(--accent-2); border-radius: 999px; padding: 9px 18px; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; margin-top: 30px; }
  .sub { font-size: 36px; color: var(--ink-2); margin-top: 22px; line-height: 1.3; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 46px; }
  .chip { font-family: var(--mono); font-size: 24px; border-radius: 14px; padding: 13px 20px; border: 1.5px solid var(--border-hover); background: rgba(16,20,30,0.85); color: var(--ink-2); }
  .chip.hot { border-color: rgba(95,208,243,0.6); color: var(--ink); }
  .foot { position: absolute; left: 200px; right: 200px; bottom: 64px; display: flex; justify-content: space-between; font-size: 22px; color: var(--muted); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="safe">
    <div class="eyebrow"><span class="pill">KATEGORİ · KISA ETİKET</span><span class="badge">v1.0</span></div>
    <h1>Kısa ve Güçlü Başlık</h1>
    <p class="sub">Alt başlık: yazının vaadi tek cümlede</p>
    <div class="chips">
      <span class="chip hot">anahtar-terim</span>
      <span class="chip">ikinci terim</span>
      <span class="chip">üçüncü terim</span>
    </div>
  </div>
  <div class="foot"><span>tahircanyildiz.com</span><span>Kaynak: resmi kaynak adı</span></div>
</body>
</html>
