<!doctype html>
<!-- KAPAK ŞABLONU — 1600x900 render edin.
     İçerik ortadaki 1200px'te kalmalı (.safe): listelerde 4:3 kırpılıyor.
     Değiştirilecekler: kategori adı, sürüm (yoksa sil), başlık (en fazla 2 satır), alt başlık, terimler (yalnızca kod/komut adları mono), kaynak. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* Sade kapak: düz zemin, üstte ince vurgu çizgisi, büyük serif başlık.
     Parlama/gradyan, ızgara deseni ve büyük harfli aralıklı etiket kullanma. */
  body { width: 1600px; height: 900px; position: relative; background: var(--bg); border-top: 10px solid var(--accent); }
  .safe { position: absolute; left: 200px; right: 200px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .kicker { display: flex; align-items: baseline; gap: 18px; font-size: 30px; color: var(--ink-2); }
  .kicker .ver { font-family: var(--mono); font-size: 26px; color: var(--muted); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 104px; line-height: 1.02; letter-spacing: -0.02em; margin-top: 26px; }
  .sub { font-size: 36px; color: var(--ink-2); margin-top: 24px; line-height: 1.3; max-width: 1100px; }
  .terms { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 48px; }
  .term { font-family: var(--mono); font-size: 24px; border-radius: 8px; padding: 10px 16px; border: 1.5px solid var(--border-hover); color: var(--ink-2); }
  .foot { position: absolute; left: 200px; right: 200px; bottom: 64px; display: flex; justify-content: space-between; font-size: 22px; color: var(--muted); }
</style>
</head>
<body>
  <div class="safe">
    <p class="kicker"><span>Kategori adı</span><span class="ver">v1.0</span></p>
    <h1>Kısa ve güçlü başlık</h1>
    <p class="sub">Alt başlık: yazının vaadi tek cümlede</p>
    <div class="terms">
      <span class="term">anahtar-terim</span>
      <span class="term">ikinci terim</span>
      <span class="term">üçüncü terim</span>
    </div>
  </div>
  <div class="foot"><span>tahircanyildiz.com</span><span>Kaynak: resmi kaynak adı</span></div>
</body>
</html>
